<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Link | OmniLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #121215;
            --border: #27272a;
            --text-main: #f4f4f5;
            --text-sub: #a1a1aa;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .gate-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .lock-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        p {
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input {
            width: 100%;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .btn {
            width: 100%;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover {
            background: var(--accent-hover);
        }
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="gate-card">
        <div class="lock-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1>Passcode Protected Link</h1>
        <p>The creator has protected this short link with a passcode. Enter the code below to proceed.</p>
        
        <form id="gateForm">
            <div class="input-group">
                <label for="passcode">Passcode</label>
                <input type="password" id="passcode" placeholder="Enter link passcode" autofocus required />
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span>Unlock & Continue</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const form = document.getElementById('gateForm');
        const input = document.getElementById('passcode');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        if (!slug) {
            errorMsg.textContent = 'No link specified.';
            errorMsg.style.display = 'block';
            submitBtn.disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            try {
                const res = await fetch('/api/verify-gate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slug, password: input.value })
                });
                const data = await res.json();
                if (res.ok && data.success && data.target_url) {
                    window.location.href = data.target_url;
                } else {
                    errorMsg.textContent = data.error || 'Incorrect passcode. Please try again.';
                    errorMsg.style.display = 'block';
                    input.select();
                }
            } catch (err) {
                errorMsg.textContent = 'Failed to verify passcode. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
